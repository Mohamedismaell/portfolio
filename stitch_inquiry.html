<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Direct Inquiry - Contact Modal</title>
<!-- Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter for clean UI, Instrument Serif for editorial italic header, Caveat for handwritten annotation -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
            handwritten: ['Caveat', 'cursive'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            modalBg: '#131418',
            surfaceField: '#191a20',
            borderDefault: '#26272e',
            borderSubtle: '#202127',
            borderFocus: '#40434f',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Fine-Tuned Typography and Interactions -->
<style data-purpose="custom-styling">
    /* Subtle scrollbar customization */
    textarea::-webkit-resizer {
      border-color: transparent;
      background-color: transparent;
    }
    .custom-resize-grip {
      background-image: radial-gradient(circle, #52535a 1.2px, transparent 1.2px);
      background-size: 4px 4px;
    }
  </style>
</head>
<body class="bg-[#0b0c0e] min-h-screen flex items-center justify-center p-4 sm:p-6 text-gray-200 antialiased selection:bg-neutral-700 selection:text-white">
<!-- BEGIN: ContactModalContainer -->
<main class="w-full max-w-[650px] relative">
<!-- Modal Card Wrapper -->
<div class="relative bg-[#131418] border border-[#23252c] rounded-[28px] p-7 sm:p-9 shadow-2xl backdrop-blur-sm">
<!-- Close Button -->
<button aria-label="Close dialog" class="absolute top-6 right-6 w-9 h-9 flex items-center justify-center rounded-full bg-[#1c1d24] hover:bg-[#272831] border border-[#2b2d36] text-gray-400 hover:text-gray-200 transition-all duration-200 cursor-pointer group" data-purpose="close-modal-button" type="button">
<svg class="w-3.5 h-3.5 group-hover:rotate-90 transition-transform duration-200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 14 14">
<line x1="2" x2="12" y1="2" y2="12"></line>
<line x1="12" x2="2" y1="2" y2="12"></line>
</svg>
</button>
<!-- BEGIN: ModalHeader -->
<header class="relative mb-7">
<!-- Uppercase Tracker Tag -->
<span class="block text-[11px] font-mono font-medium tracking-[0.18em] text-neutral-400 uppercase mb-2.5">
          Direct Inquiry
        </span>
<!-- Headline with Editorial Italic Font -->
<h1 class="text-[40px] sm:text-[46px] leading-[1.08] text-[#f2f2f3] font-normal tracking-tight">
          Let's <span class="font-serif italic text-[45px] sm:text-[52px] font-light text-white">talk.</span>
</h1>
<!-- Subtitle -->
<p class="text-[13.5px] sm:text-[14px] leading-relaxed text-[#8f919a] mt-2.5 max-w-[430px]">
          I'm always open to discussing new opportunities, interesting ideas, or potential collaborations.
        </p>
<!-- Hand-drawn Annotation note and Arrow -->
<div class="hidden sm:block absolute right-2 -bottom-4 pointer-events-none select-none text-[#73757f]">
<div class="font-handwritten text-[18px] leading-[1.1] rotate-[7deg] text-[#8e909c]">
<div>Ideas</div>
<div class="pl-2">Projects</div>
<div class="pl-4">Collaboration</div>
</div>
<!-- Curved Hand-drawn SVG Arrow pointing downward to selector pills -->
<svg class="w-9 h-12 text-[#686b76] ml-2 -mt-1 transform -rotate-12 stroke-current" fill="none" viewbox="0 0 50 60">
<path d="M36 4C28 14 15 28 14 44" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"></path>
<path d="M7 37L13.8 45.5L20 38" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path>
</svg>
</div>
</header>
<!-- END: ModalHeader -->
<!-- BEGIN: InquiryForm -->
<form class="space-y-5" id="contact-form" onsubmit="event.preventDefault();">
<!-- Two-column row: Name & Email Inputs -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Name Field -->
<div class="space-y-2">
<label class="block text-[11px] font-mono tracking-[0.14em] uppercase text-[#737580]" for="name">
              Your Name
            </label>
<div class="relative rounded-2xl bg-[#18191f]/90 border border-[#26272f] hover:border-[#32343e] focus-within:!border-[#4a4d5c] focus-within:ring-1 focus-within:ring-[#4a4d5c] transition-colors">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#6e707b]">
<!-- User Icon -->
<svg class="w-4 h-4 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
<input class="w-full bg-transparent border-0 pl-10 pr-3.5 py-3 text-sm text-[#e2e3e8] placeholder-[#575965] focus:outline-none focus:ring-0" id="name" name="name" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[11px] font-mono tracking-[0.14em] uppercase text-[#737580]" for="email">
              Your Email
            </label>
<div class="relative rounded-2xl bg-[#18191f]/90 border border-[#26272f] hover:border-[#32343e] focus-within:!border-[#4a4d5c] focus-within:ring-1 focus-within:ring-[#4a4d5c] transition-colors">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#6e707b]">
<!-- Mail Icon -->
<svg class="w-4 h-4 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="16" rx="2" width="20" x="2" y="4"></rect>
<path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
</svg>
</div>
<input class="w-full bg-transparent border-0 pl-10 pr-3.5 py-3 text-sm text-[#e2e3e8] placeholder-[#575965] focus:outline-none focus:ring-0" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
</div>
<!-- Inquiry Reason Category Pills -->
<div class="space-y-2.5">
<label class="block text-[11px] font-mono tracking-[0.14em] uppercase text-[#737580]">
            What brings you here?
          </label>
<div aria-label="Inquiry options" class="flex flex-wrap items-center gap-2.5" role="group">
<!-- Pill 1: A project (Active state by default) -->
<button class="category-pill active-pill px-5 py-2.5 rounded-full text-[13px] font-medium transition-all duration-150 border bg-[#1d1e25] text-white border-[#7b7e8d] shadow-[0_0_12px_rgba(255,255,255,0.06)]" data-pill="true" type="button">
              A project
            </button>
<!-- Pill 2: A job opportunity -->
<button class="category-pill px-5 py-2.5 rounded-full text-[13px] font-medium transition-all duration-150 border bg-[#18191f] text-[#8e919c] border-[#262730] hover:border-[#3b3d49] hover:text-[#c4c6cf]" data-pill="true" type="button">
              A job opportunity
            </button>
<!-- Pill 3: Something else -->
<button class="category-pill px-5 py-2.5 rounded-full text-[13px] font-medium transition-all duration-150 border bg-[#18191f] text-[#8e919c] border-[#262730] hover:border-[#3b3d49] hover:text-[#c4c6cf]" data-pill="true" type="button">
              Something else
            </button>
</div>
</div>
<!-- Tell Me More: Textarea Field -->
<div class="space-y-2 pt-0.5">
<label class="block text-[11px] font-mono tracking-[0.14em] uppercase text-[#737580]" for="message">
            Tell me more
          </label>
<div class="relative rounded-2xl bg-[#18191f]/90 border border-[#26272f] hover:border-[#32343e] focus-within:!border-[#4a4d5c] focus-within:ring-1 focus-within:ring-[#4a4d5c] transition-colors p-3.5">
<div class="flex items-start gap-2.5">
<!-- Message Bubble Icon -->
<div class="pt-0.5 text-[#6e707b] pointer-events-none flex-shrink-0">
<svg class="w-4 h-4 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
</svg>
</div>
<textarea class="w-full bg-transparent border-0 p-0 text-sm text-[#e2e3e8] placeholder-[#575965] focus:outline-none focus:ring-0 resize-y min-h-[90px]" id="message" name="message" placeholder="Share details about your project, timeline, or anything else..." rows="4"></textarea>
</div>
<!-- Subtitle Resize Indicator Grip on Bottom Right -->
<div class="absolute bottom-2 right-2 w-3 h-3 pointer-events-none opacity-40">
<svg class="w-full h-full stroke-[#8e919c]" fill="none" viewbox="0 0 10 10">
<line stroke-width="1.2" x1="8" x2="2" y1="2" y2="8"></line>
<line stroke-width="1.2" x1="8" x2="5" y1="5" y2="8"></line>
</svg>
</div>
</div>
</div>
<!-- Primary Submit Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-6 rounded-full bg-white text-[#111215] hover:bg-[#eaebee] active:scale-[0.99] font-medium text-[14.5px] transition-all duration-150 flex items-center justify-center gap-2.5 shadow-lg shadow-black/30 cursor-pointer group" data-purpose="submit-form-button" type="submit">
<span>Send Message</span>
<!-- Paper airplane icon -->
<svg class="w-4 h-4 fill-current transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform duration-150" viewbox="0 0 24 24">
<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
</svg>
</button>
</div>
</form>
<!-- END: InquiryForm -->
<!-- BEGIN: ModalFooter -->
<footer class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-2.5 text-[12px] text-[#737580] pt-1">
<!-- Privacy Notice with Lock Icon -->
<div class="flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 text-[#737580] stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
<span>Your information is safe with me.</span>
</div>
<!-- Response SLA with Online Indicator Dot -->
<div class="flex items-center gap-2">
<span>Usually reply within <strong class="font-semibold text-neutral-300">24 hours</strong>.</span>
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-[#22c55e]"></span>
</span>
</div>
</footer>
<!-- END: ModalFooter -->
</div>
</main>
<!-- END: ContactModalContainer -->
<!-- JavaScript for Interactive Category Selection -->
<script data-purpose="pill-selector">
    document.addEventListener('DOMContentLoaded', () => {
      const pills = document.querySelectorAll('[data-pill]');
      
      pills.forEach((pill) => {
        pill.addEventListener('click', () => {
          // Remove active styles from all pills
          pills.forEach(p => {
            p.classList.remove('bg-[#1d1e25]', 'text-white', 'border-[#7b7e8d]', 'shadow-[0_0_12px_rgba(255,255,255,0.06)]');
            p.classList.add('bg-[#18191f]', 'text-[#8e919c]', 'border-[#262730]');
          });

          // Apply active styling to selected pill
          pill.classList.remove('bg-[#18191f]', 'text-[#8e919c]', 'border-[#262730]');
          pill.classList.add('bg-[#1d1e25]', 'text-white', 'border-[#7b7e8d]', 'shadow-[0_0_12px_rgba(255,255,255,0.06)]');
        });
      });
    });
  </script>
</body></html>
